    <script>
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => {
                splash.classList.add('hidden-splash');
                document.body.style.overflow = 'auto'; 
            }, 2500); 
        });

        const API_URL = "http://localhost:3000/api";
        let html5QrCode;
        let activeInputId = null;

        function startScanner(inputId) {
            activeInputId = inputId;
            document.getElementById("scanner-modal").classList.remove("hidden");

            const formatsToSupport = [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.QR_CODE
            ];

            html5QrCode = new Html5Qrcode("reader");
            const config = {
                fps: 10, qrbox: { width: 300, height: 100 }, aspectRatio: 1.0,
                formatsToSupport: formatsToSupport,
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            };

            html5QrCode.start(
                { facingMode: "environment" }, config,
                (decodedText) => {
                    playBeep();
                    document.getElementById(activeInputId).value = decodedText;
                    stopScanner();
                },
                (err) => {}
            ).catch(err => {
                console.log(err);
                Swal.fire({icon: 'error', title: 'Hata', text: 'Kamera açılamadı.'});
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById("scanner-modal").classList.add("hidden");
                    html5QrCode.clear();
                }).catch(err => console.log(err));
            } else {
                document.getElementById("scanner-modal").classList.add("hidden");
            }
        }

        function playBeep() {
            const sound = document.getElementById("beepSound");
            sound.currentTime = 0; sound.play().catch(e=>{});
        }

        async function login() {
    const code = document.getElementById("schoolCode").value;
    const pass = document.getElementById("schoolPass").value;
    const remember = document.getElementById("beniHatirla").checked; // Checkbox durumu
    const btn = document.querySelector(".btn-login");

    if (!code || !pass) { Swal.fire({icon:'warning', title:'Eksik', text:'Bilgileri doldurun'}); return; }
    
    btn.innerText = "..."; btn.disabled = true;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ schoolCode: code, schoolPass: pass })
        });
        const result = await response.json();

        if (result.status === 'success') {
            // 1. Okul İsmini Kaydet
            localStorage.setItem("okul_ismi", result.schoolName);
            document.getElementById("headerTitle").innerText = result.schoolName;

            // 2. Beni Hatırla Mantığı
            if (remember) {
                localStorage.setItem("kutuphane_code", code);
                localStorage.setItem("kutuphane_pass", pass);
                localStorage.setItem("beni_hatirla", "true");
            } else {
                // İşaretli değilse, oturum boyunca kalsın ama hafızadan silelim (İsteğe bağlı)
                // Ama API çağrıları için localStorage kullanıyoruz, o yüzden "geçici" tutmak lazım.
                // Şimdilik sistemin çalışması için localStorage'a yazıyoruz ama
                // bir sonraki açılışta silinecek şekilde işaretleyebiliriz.
                // Basitlik adına: İşaretli değilse kayıtlı şifreleri temizlemiyoruz ama
                // sayfa açılışında otomatik doldurmayı engelliyoruz.
                localStorage.setItem("kutuphane_code", code);
                localStorage.setItem("kutuphane_pass", pass);
                localStorage.removeItem("beni_hatirla");
            }

            const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });
            Toast.fire({ icon: 'success', title: 'Giriş Başarılı' });
            
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            // ... dashboard visible yapıldıktan hemen sonra ...
    getStats(); // <--- BU SATIRI EKLE
    getOverdueBooks();
        } else {
            Swal.fire({icon:'error', title:'Hata', text: result.message});
        }
    } catch (error) {
        Swal.fire({icon:'error', title:'Hata', text:'Sunucu hatası'});
    } finally {
        btn.innerText = "Giriş Yap"; btn.disabled = false;
    }
}

window.onload = function() {
    // Splash Screen kapatma (Mevcut kodun)
    const splash = document.getElementById('splash-screen');
    if(splash) {
        setTimeout(() => {
            splash.classList.add('hidden-splash');
            document.body.style.overflow = 'auto'; 
        }, 2500);
    }

    // --- BENİ HATIRLA KONTROLÜ ---
    const isRemembered = localStorage.getItem("beni_hatirla");
    const savedCode = localStorage.getItem("kutuphane_code");
    
    if (isRemembered === "true" && savedCode) {
        // Beni hatırla seçiliyse bilgileri doldur
        document.getElementById("schoolCode").value = savedCode;
        document.getElementById("schoolPass").value = localStorage.getItem("kutuphane_pass");
        document.getElementById("beniHatirla").checked = true;
    } else {
        // Seçili değilse kutuları boşalt
        document.getElementById("schoolCode").value = "";
        document.getElementById("schoolPass").value = "";
        document.getElementById("beniHatirla").checked = false;
    }

    // Okul ismi varsa başlığa yaz
    const savedName = localStorage.getItem("okul_ismi");
    if(savedName) {
        document.getElementById("headerTitle").innerText = savedName;
    }
};
        function logout() {
            Swal.fire({ title: 'Çıkış?', icon: 'question', showCancelButton: true, confirmButtonText: 'Evet', cancelButtonText: 'Hayır' }).then((res) => {
                if (res.isConfirmed) { localStorage.clear(); location.reload(); }
            });
        }

        function showTab(tabName) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.getElementById("tab-" + tabName).classList.remove("hidden");
            document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
            event.currentTarget.classList.add("active");
        }

        // --- İŞLEM YAP (SENİN ID'LERİNE GÖRE DÜZENLENMİŞ + GERİ AL EKLİ) ---
async function islemYap(actionType) {
    const code = localStorage.getItem("kutuphane_code");
    const pass = localStorage.getItem("kutuphane_pass");
    
    // Verileri topluyoruz
    let data = { schoolCode: code, schoolPass: pass };
    let endpoint = actionType === 'kitapVer' ? "/api/kitapVer" : "/api/kitapAl";

    // Geri alma işleminde kullanmak için bu değerleri saklayalım
    let islemBarkod = "";
    let islemOgrNo = "";

    if (actionType === 'kitapVer') {
        data.ogrNo = document.getElementById("verOgrNo").value;
        data.barkod = document.getElementById("verBarkod").value;
        
        islemOgrNo = data.ogrNo; // Sakla
        islemBarkod = data.barkod; // Sakla

        if (!data.ogrNo || !data.barkod) { 
            Swal.fire({icon:'warning', title:'Eksik', text:'Bilgileri giriniz'}); 
            return; 
        }
    } else {
        data.barkod = document.getElementById("alBarkod").value;
        islemBarkod = data.barkod; // Sakla
        // İade alırken öğrenci nosu girilmediği için boş bırakıyoruz
        
        if (!data.barkod) { 
            Swal.fire({icon:'warning', title:'Eksik', text:'Barkod okutunuz'}); 
            return; 
        }
    }

    // Yükleniyor...
    Swal.fire({ title: 'İşleniyor...', didOpen: () => Swal.showLoading() });

    try {
        const response = await fetch(endpoint, {
            method: "POST", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(data)
        });
        const result = await response.json();
        // Eğer sunucudan öğrenci numarası geldiyse (Teslim Al işleminde) onu hafızaya al
        if (result.studentNo) {
            islemOgrNo = result.studentNo;
        }
        // ---------------------

        if (result.status === 'success') {
            playBeep();
            
            // Mesajı hazırla (Raf bilgisi varsa ekle)
            let msg = result.message;
            if(result.raf) {
                msg += `<br><br><div style="font-size:1.2rem; color:#4f46e5;">Raf No: <b>${result.raf}</b></div>`;
                msg += `<div style="font-size:0.9rem; margin-top:5px; color:#555;">Lütfen kitabı rafa yerleştiriniz.</div>`;
            }

            // --- POPUP (GERİ AL BUTONU EKLENDİ) ---
            const popup = await Swal.fire({ 
                icon: 'success', 
                title: 'Başarılı', 
                html: msg, 
                showConfirmButton: true, 
                confirmButtonText: 'TAMAM', 
                confirmButtonColor: '#10b981', 
                
                // İPTAL BUTONU AYARLARI
                showDenyButton: true,
                denyButtonText: 'Hatalı İşlem - Geri Al',
                denyButtonColor: '#ef4444',
                
                allowOutsideClick: false 
            });

            // EĞER GERİ AL BUTONUNA BASILIRSA
            if (popup.isDenied) {
                Swal.fire({ title: 'Geri Alınıyor...', didOpen: () => Swal.showLoading() });

                // Backend'deki /api/undo servisine istek atıyoruz
                try {
                    const undoResp = await fetch('/api/undo', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            schoolCode: code, 
                            schoolPass: pass,
                            // Eğer 'kitapVer' yaptıysak undo tipi 'ver' olur, 'kitapAl' ise 'al' olur.
                            type: actionType === 'kitapVer' ? 'ver' : 'al',
                            bookCode: islemBarkod,
                            studentNo: islemOgrNo // Kitap Verirken girdiğimiz no
                        })
                    });

                    const undoRes = await undoResp.json();
                    if (undoRes.status === 'success') {
                        Swal.fire('Geri Alındı', undoRes.message, 'info');
                        // Listeleri güncellemek iyi olur
                        if(typeof getRecentActivity === 'function') getRecentActivity();
                        if(typeof getStats === 'function') getStats();
                    } else {
                        Swal.fire('Hata', 'Geri alma başarısız oldu: ' + undoRes.message, 'error');
                    }
                } catch (undoErr) {
                    Swal.fire('Hata', 'Sunucu hatası (Undo).', 'error');
                }
            }

            // Inputları temizle
            if(document.getElementById("verBarkod")) document.getElementById("verBarkod").value = "";
            if(document.getElementById("alBarkod")) document.getElementById("alBarkod").value = "";
            // Öğrenci numarasını silmek istemeyebilirsin (seri işlem için), istersen alt satırı aktif et:
            // document.getElementById("verOgrNo").value = ""; 

            // Listeleri güncelle
            if(typeof getRecentActivity === 'function') getRecentActivity();
            if(typeof getOverdueBooks === 'function') getOverdueBooks();
            if(typeof getStats === 'function') getStats();

        } else {
            Swal.fire({ icon: 'error', title: 'Hata', text: result.message });
        }
    } catch (error) {
        Swal.fire({ icon: 'error', title: 'Hata', text: error.message });
    }
}
// --- SORGULA FONKSİYONU (TAM VE TEK HALİ) ---
async function sorgula(incomingType) {
    console.log("Sorgula Tetiklendi. Gelen Tür:", incomingType); 

    const inputEl = document.getElementById("sorguInput");
    const resultArea = document.getElementById("sorguSonucAlani");
    const query = inputEl.value.trim();

    // 1. KONTROL: Kutu boş mu?
    if (!query) {
        Swal.fire({ icon: 'warning', title: 'Eksik', text: 'Lütfen numara veya barkod yazınız.' });
        return;
    }

    // 2. TÜR BELİRLEME
    let searchType = incomingType;

    // Eğer tür gelmediyse (Enter'a basıldıysa), Popup açıp soralım
    if (!searchType) {
        const popup = await Swal.fire({
            title: 'Ne arıyorsunuz?',
            text: 'Lütfen seçim yapınız:',
            icon: 'question',
            showDenyButton: true,
            confirmButtonText: 'Öğrenci',
            denyButtonText: 'Kitap',
            confirmButtonColor: '#6366f1',
            denyButtonColor: '#f59e0b',
            allowOutsideClick: false
        });

        if (popup.isConfirmed) searchType = 'student';
        else if (popup.isDenied) searchType = 'book';
        else return; // İptal edildi
    }

    // 3. API İSTEĞİ
    resultArea.innerHTML = '<div style="text-align:center; padding:20px; font-weight:bold; color:#6b7280;">Aranıyor...</div>';
    
    const code = localStorage.getItem("kutuphane_code");
    const pass = localStorage.getItem("kutuphane_pass");

    try {
        const response = await fetch('/api/sorgula', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                schoolCode: code, 
                schoolPass: pass, 
                query: query,
                type: searchType 
            })
        });
        
        const res = await response.json();

        if (res.status === 'success') {
            let html = '';

            // A) KİTAP BULUNDU
            if (res.result.type === 'book') {
                if(res.result.data.length === 0) {
                    resultArea.innerHTML = '<div style="text-align:center; color:red; padding:15px;">Kayıt bulunamadı.</div>'; return;
                }
                res.result.data.forEach(book => {
                    const statusClass = book.status === 'In' ? 'badge-raf' : 'badge-out';
                    const statusText = book.status === 'In' ? `RAF: ${book.shelf || '?'}` : `KİMDE: ${book.holder} (${book.holderNo})`;
                    const extraInfo = book.status === 'Out' ? `<br><small style="color:#6b7280">Veriliş: ${book.date}</small>` : '';

                    html += `
                    <div class="result-card" style="border-left: 5px solid #f59e0b;">
                        <div class="card-header"><span class="material-symbols-rounded" style="vertical-align:middle">menu_book</span> ${book.name}</div>
                        <div class="card-sub">Barkod: <b>${book.code}</b></div>
                        <div class="card-sub">${book.author || '-'}</div>
                        <div style="margin-top:5px;"><span class="badge ${statusClass}">${statusText}</span> ${extraInfo}</div>
                    </div>`;
                });
            } 
            // B) ÖĞRENCİ BULUNDU
            else if (res.result.type === 'student') {
                const std = res.result.data;
                html += `
                <div class="result-card" style="border-left: 5px solid #6366f1;">
                    <div class="card-header"><span class="material-symbols-rounded" style="vertical-align:middle">person</span> ${std.name}</div>
                    <div class="card-sub">No: <b>${std.no}</b> | Sınıf: ${std.class}</div>
                    <hr style="margin:10px 0; border:0; border-top:1px solid #eee;">
                    <strong>Elindeki Kitaplar (${std.books.length}):</strong>
                `;
                
                if (std.books.length > 0) {
                    std.books.forEach(b => {
                        html += `
                        <div class="book-list-item" style="flex-direction:column; gap:2px;">
                            <div style="font-weight:600;">${b.name}</div>
                            <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#6b7280;">
                                <span>${b.code}</span>
                                <span>${b.date}</span>
                            </div>
                        </div>`;
                    });
                } else {
                    html += '<div style="color:green; margin-top:5px; font-size:0.9rem;">Elinde kitap yok.</div>';
                }
                html += '</div>';
            }
            resultArea.innerHTML = html;
        } else {
            resultArea.innerHTML = `<div style="text-align:center; color:red; padding:15px;">${res.message}</div>`;
        }
    } catch (error) {
        console.error("Hata:", error);
        resultArea.innerHTML = '<div style="text-align:center; color:red;">Bağlantı hatası!</div>';
    }
}

// --- ENTER TUŞU YÖNETİMİ ---
function handleEnter(e, type) {
    if (e.key === "Enter") {
        e.preventDefault(); // Sayfa yenilemeyi durdur
        if(type === 'sorgu') {
            sorgula(null); // Parametresiz çağır -> Popup açılır
        } else {
            type === 'ver' ? islemYap('kitapVer') : islemYap('kitapAl');
        }
    }
}
// --- İSTATİSTİKLERİ ÇEK ---
async function getStats() {
    const code = localStorage.getItem("kutuphane_code");
    const pass = localStorage.getItem("kutuphane_pass");
    
    // Yükleniyor efekti (...)
    document.getElementById("stat-kitap").innerText = "...";
    document.getElementById("stat-ogrenci").innerText = "...";
    document.getElementById("stat-emanet").innerText = "...";

    try {
        const response = await fetch('/api/stats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ schoolCode: code, schoolPass: pass })
        });
        const res = await response.json();

        if (res.status === 'success') {
            // Sayıları animasyonlu gibi gösterelim
            document.getElementById("stat-kitap").innerText = res.data.kitap;
            document.getElementById("stat-ogrenci").innerText = res.data.ogrenci;
            document.getElementById("stat-emanet").innerText = res.data.emanet;
        }
    } catch (error) {
        console.error("İstatistik alınamadı");
    }
}
